server.address=127.0.0.1
rotabrasil.seguranca.ativa=true
rotabrasil.seguranca.admin-usuario=${ROTABRASIL_ADMIN_USUARIO:admin}
rotabrasil.seguranca.admin-hash=${ROTABRASIL_ADMIN_HASH:}
server.servlet.session.cookie.http-only=true
# Callback OAuth é navegação GET entre sites; Lax mantém a sessão sem liberar POST cross-site.
# As ações continuam protegidas por CSRF e ADMIN/OPERADOR.
server.servlet.session.cookie.same-site=lax
spring.h2.console.enabled=false
spring.flyway.enabled=false
rotabrasil.arquivos.caminhos-relativos=true
rotabrasil.processamentos.concorrentes=2
server.servlet.session.cookie.secure=true
